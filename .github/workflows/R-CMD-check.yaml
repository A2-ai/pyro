# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: '4.5'}
          - {os: windows-latest, r: '4.5'}
          - {os: ubuntu-latest,  r: '4.5'}
          - {os: ubuntu-latest,  r: '4.4'}
          - {os: ubuntu-latest,  r: '4.3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: a2-ai/setup-rv@main

      - name: Skip docs dependencies
        if: runner.os != 'Windows'
        run: rv remove --no-sync starlightr

      - name: Skip docs dependencies (Windows)
        if: runner.os == 'Windows'
        run: rv.exe remove --no-sync starlightr

      - name: replace-rversion
        run: |
          perl -i -pe 's|^r_version = "4\.[0-9\.]+"$|r_version = "${{ matrix.config.r }}"|' rproject.toml
          cat rproject.toml
        if: runner.os != 'Windows'

      - name: replace-rversion (Windows)
        run: |
          $rVersion = "${{ matrix.config.r }}"
          (Get-Content rproject.toml) -replace '^r_version = "4\.[0-9\.]+"$', "r_version = `"$rVersion`"" | Set-Content rproject.toml
          Get-Content rproject.toml
        shell: pwsh
        if: runner.os == 'Windows'

      - name: fix windows repository
        run: |
          rv.exe configure repository remove PRISM
          rv.exe configure repository add PPM --url https://packagemanager.posit.co/cran/2026-05-10
        shell: cmd
        if: runner.os == 'Windows'

      - name: rv-plan
        run: rv plan
        if: runner.os != 'Windows'

      - name: rv-plan (Windows)
        run: rv.exe plan -vvv
        shell: cmd
        if: runner.os == 'Windows'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libuv1-dev libgit2-dev libssl-dev libxml2-dev zlib1g-dev \
            libfontconfig-dev libfreetype-dev libfribidi-dev libharfbuzz-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev

      - name: rv-sync
        run: rv sync
        if: runner.os != 'Windows'

      - name: rv-sync (Windows)
        run: rv.exe sync -vvv
        shell: cmd
        if: runner.os == 'Windows'

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
