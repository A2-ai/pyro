[project]
name = "fyr-env"
version = "0.0.1"
description = "Python environment for the fyr R-package ecosystem (reportifyr, presentifyr)."
requires-python = ">=3.12"

[dependency-groups]
reportifyr = [
    "python-docx==1.1.2",
    "pyyaml==6.0.2",
    "pillow==11.1.0",
]
presentifyr = [
    "python-pptx==1.0.2",
    "pillow==11.1.0",
]
